name: Schema reference drift

# The schema reference pages under docs/fern/pages/reference/schemas/ are generated
# from the doc-detective-common schemas by docs/.scripts/buildSchemaReferencesV4.js.
# This check regenerates them and fails if the committed pages have drifted — either
# because a schema changed without regenerating, or because a page was hand-edited.
# It first rebuilds doc-detective-common from the authored schemas and fails if the
# committed schema bundles or generated types drift, e.g. a schema edit committed
# without rebuilding, or types regenerated by a different json-schema-to-typescript.

on:
  pull_request:
    paths:
      - "src/common/src/schemas/**"
      - "src/common/src/types/generated/**"
      - "src/common/scripts/generateTypes.cjs"
      - "src/common/package.json"
      - "package-lock.json"
      - ".github/workflows/docs-schema-refs.yml"
      - "docs/fern/pages/reference/schemas/**"
      - "docs/.scripts/buildSchemaReferencesV4.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (no postinstall)
        run: npm ci --ignore-scripts

      # Only the steps that write committed files; `compile` writes gitignored dist/.
      - name: Rebuild doc-detective-common schemas and types
        working-directory: src/common
        run: npm run dereferenceSchemas && npm run generate:types

      - name: Fail if committed common artifacts are out of date
        run: |
          untracked="$(git ls-files --others --exclude-standard -- src/common/src)"
          if ! git diff --quiet -- src/common/src || [ -n "$untracked" ]; then
            echo "::error::doc-detective-common's generated schemas or types are out of date. Run 'npm ci && npm run build:common' and commit the result."
            git --no-pager diff --stat -- src/common/src
            [ -n "$untracked" ] && { echo "Untracked generated files:"; echo "$untracked"; }
            exit 1
          fi
          echo "doc-detective-common artifacts are up to date."

      # Regenerates from the schema bundle (src/common/.../schemas.json), which the
      # previous step proved matches the authored sources.
      - name: Regenerate schema reference pages
        run: npm run docs:build-schema-refs

      - name: Fail if generated pages are out of date
        run: |
          untracked="$(git ls-files --others --exclude-standard -- docs/fern/pages/reference/schemas)"
          if ! git diff --quiet -- docs/fern/pages/reference/schemas || [ -n "$untracked" ]; then
            echo "::error::Schema reference pages are out of date. Run 'npm run docs:build-schema-refs' and commit the result. Do not hand-edit docs/fern/pages/reference/schemas/*.mdx."
            git --no-pager diff --stat -- docs/fern/pages/reference/schemas
            [ -n "$untracked" ] && { echo "Untracked generated pages:"; echo "$untracked"; }
            exit 1
          fi
          echo "Schema reference pages are up to date."
