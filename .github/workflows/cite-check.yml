name: Check citations
on:
  pull_request:

permissions:
  contents: read

jobs:
  cite-check:
    runs-on: ubuntu-latest
    # No path filter, because a code change is what makes a pinned claim go stale.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check that pinned claims still match their code
        # Pinned so that a new manni rule can't fail an unrelated PR.
        run: npx --yes @hawkeyexl/manni@4.27.2 cite check
