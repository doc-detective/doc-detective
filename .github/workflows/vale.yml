name: Vale style check
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# One vale run per PR at a time. The github-pr-review reporter doesn't just post
# comments, it owns them: every run lists the comments reviewdog left before and
# deletes the ones the current run no longer reports. Two runs racing on the same
# PR therefore prune the same comment set concurrently, and the loser gets a 404
# on a comment the winner already deleted, which reviewdog treats as fatal. That
# failed the check on c28bb334, whose run started while the previous commit's was
# still in its delete phase. Cancelling the superseded run also keeps a
# rapid-push branch from queueing runs whose results nobody will read. Required
# status checks are evaluated against the head SHA, so cancelling a run on an
# older SHA doesn't leave the PR blocked.
concurrency:
  group: vale-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vale:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    if: |
      github.event.pull_request.user.login != 'github-actions'
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Install mdx2vast
        run: |
          npm i -g mdx2vast

      - name: Run vale
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff #v3.0.0
        with:
          # Lint the WHOLE repository on every PR, not only the files it touched.
          # `all` is vale-action's sentinel for ".", so there is no changed-file
          # list to marshal and the JSON-array hazard ADR 01089 documents can no
          # longer apply. See ADR 01098.
          files: all
          # Voices (pulled in by the Moose package) needs Vale >= 3.20.0.
          version: 3.20.0
          # Exclude the generated schema reference pages. Vale parses .mdx through
          # mdx2vast, whose MDX pipeline doesn't treat GFM tables as tables — the
          # whole fields table collapses into one paragraph, backtick code spans
          # then pair across rows, and schema prose containing angle brackets
          # (`<contextId>`, `<os.tmpdir()>`) is parsed as JSX. That has produced a
          # hard E100 runtime error, which fail_on_error can't downgrade. Fern
          # renders the same pages correctly, so this is a linter-parser
          # limitation, not bad content. docs/.vale.ini also clears every style
          # for those pages; the glob keeps them out of the parse as well.
          #
          # --minAlertLevel=error is load-bearing under whole-repo + nofilter.
          # docs/.vale.ini sets MinAlertLevel = suggestion, which is right for a
          # local run but would hand reviewdog ~4,200 warnings and suggestions
          # from across the tree to post as PR comments. Emitting only errors
          # keeps the comment volume to what the gate actually fails on. Run
          # Vale locally for the warnings.
          #
          # docs/.vale/** is Vale's own StylesPath. Invoked from the repo root
          # against ".", Vale walks it as ordinary content and lints the
          # vocabulary word lists, where Direct.Length reads
          # docs/.vale/styles/config/vocabularies/Docs/accept.txt as one
          # 252-word sentence. Those are machine-managed config, not prose.
          vale_flags: "--config=docs/.vale.ini --minAlertLevel=error --glob=!{docs/.vale/**,docs/fern/pages/reference/schemas/**}"
          reporter: github-pr-review
          # `filter_mode` and `fail_on_error` are a load-bearing pair. reviewdog's
          # default filter (`added`) reports only alerts on lines the PR added, so
          # a whole-repo lint would report nothing for an error in an untouched
          # file and fail_on_error would never trip. `nofilter` surfaces every
          # alert, and fail_on_error turns an error-severity alert anywhere in the
          # repository into a failed check.
          filter_mode: nofilter
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
