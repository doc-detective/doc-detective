# Runs Doc Detective against the documentation so the inline tests embedded in
# the docs (the docs-as-tests pattern) execute on every docs change. Two jobs,
# one on ubuntu-latest and one on windows-latest, each run all tests under
# docs/fern/pages through the Doc Detective Action and fail on any FAIL
# (exit_on_fail). The Windows job also fails when a Windows test is skipped.
# A third, sharded job runs the docs-as-tests reference examples on both.
#
# It runs the repo's OWN build (build + `npm link`, then the Action with an empty
# `version` so bare `npx doc-detective` resolves the linked local build) rather
# than the published package: the docs describe the code in this repo, so they
# must be tested against it — not against whatever happens to be released.
name: Test docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/test-docs.yml"
  workflow_dispatch:

concurrency:
  group: test-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-docs:
    name: Test docs
    runs-on: ubuntu-latest
    # Successful runs take up to about 30 minutes, so match the Windows job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Link local build
        run: npm link

      # The docs-as-tests reference shows each example as prose, detected,
      # inline, and standalone files. Its snippets must match the files, and
      # the variants must resolve to the same steps.
      - name: Check docs-as-tests examples
        run: |
          npm run docs:build-docs-as-tests -- --check
          npm run docs:check-docs-as-tests

      - name: Run Doc Detective on the docs
        uses: doc-detective/github-action@55ba39bc460e809c279179421fb26a8c76fc2539 # v2.2.0
        with:
          version: "" # bare npx doc-detective -> the linked local build above
          config: docs/.doc-detective.json
          input: docs/fern/pages
          exit_on_fail: true

  # Runs the same docs suite on a Windows runner, so the Windows-only inline
  # tests (runOn platforms windows: native app surfaces, PowerShell commands)
  # actually run instead of being skipped by the Linux job above. windows-latest
  # runs an interactive desktop session, which native app surfaces need. The
  # gate after the run fails the job when any Windows context was skipped, so a
  # runner or driver regression can't turn the Windows tests into silent skips.
  test-docs-windows:
    name: Test docs (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep npm's cache on D:, before setup-node restores into it. C: is slow
      # at small-file I/O (see the dd-cache action).
      - shell: bash
        run: if [ -d D:/ ]; then echo 'npm_config_cache=D:\npm-cache' >> "$GITHUB_ENV"; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Doc Detective install cache (browsers, drivers, git-bash), shared with
      # test.yml and fixtures.yml. See docs/maintenance/ci-cache-warming.md.
      - uses: ./.github/actions/dd-cache
        with:
          node: '24'

      - run: npm ci
      - run: npm run build
      - name: Link local build
        run: npm link

      # Android tests run in the Linux job above, which has KVM for the
      # emulator. Windows runners have no hardware acceleration, so the emulator
      # can't boot here: turn off the lazy SDK install so the Android test
      # skips on this runner instead of downloading the SDK and timing out.
      - name: Run Doc Detective on the docs
        uses: doc-detective/github-action@55ba39bc460e809c279179421fb26a8c76fc2539 # v2.2.0
        env:
          DOC_DETECTIVE_NO_ANDROID_AUTOINSTALL: '1'
        with:
          version: "" # bare npx doc-detective -> the linked local build above
          config: docs/.doc-detective.json
          input: docs/fern/pages
          exit_on_fail: true
          android: 'false'

      # The action writes its results to $RUNNER_TEMP/doc-detective-output.json,
      # the same file fixtures.yml gates on (scripts/check-fixture-results.cjs).
      # Fail when the run found no specs, found no Windows contexts, or any
      # context that targets Windows was SKIPPED. On this runner every Windows
      # test must run. A spec skipped at spec level (for example a spec-level
      # runOn for another platform) reports no contexts, so it counts toward
      # neither list.
      - name: Require every Windows test to run
        if: always()
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const path = require("node:path");
          const file = path.join(process.env.RUNNER_TEMP, "doc-detective-output.json");
          if (!fs.existsSync(file)) {
            console.error(`No results file at ${file}.`);
            process.exit(1);
          }
          const specs = JSON.parse(fs.readFileSync(file, "utf8")).specs || [];
          if (specs.length === 0) {
            console.error("No specs ran. Check the input path.");
            process.exit(1);
          }
          const ran = [];
          const skipped = [];
          for (const spec of specs) {
            for (const test of spec.tests || []) {
              for (const context of test.contexts || []) {
                if (!context || context.platform !== "windows") continue;
                const row = `${test.testId ?? "(no id)"} (${spec.specId ?? "(no id)"}): ${context.result}`;
                if (context.result === "SKIPPED") {
                  skipped.push(`${row} - ${context.resultDescription || "no reason given"}`);
                } else {
                  ran.push(row);
                }
              }
            }
          }
          if (ran.length === 0 && skipped.length === 0) {
            console.error("No Windows contexts in the results. Expected at least one Windows test to run.");
            process.exit(1);
          }
          console.log(`Windows contexts that ran (${ran.length}):`);
          for (const row of ran) console.log(`  ${row}`);
          if (skipped.length > 0) {
            console.error(`Windows contexts that were skipped (${skipped.length}):`);
            for (const row of skipped) console.error(`  ${row}`);
            process.exit(1);
          }

      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-docs-windows-output
          path: ${{ runner.temp }}/doc-detective-output.json
          retention-days: 3
          if-no-files-found: warn

  # Runs the docs-as-tests examples (docs/docs-as-tests/examples). They live
  # outside the docs run's input, so the docs run's capture settings don't slow
  # them down, and they run here with the examples' own configs, whose
  # beforeAll starts the test servers. Each example runs its standalone spec,
  # one detected variant, and inline.txt where it has one (see
  # docs/.scripts/checkDocsAsTests.js), split into shards that run in parallel.
  # On Windows, --require-platform fails the shard when a Windows context is
  # skipped, like the gate in the Windows docs job.
  docs-as-tests:
    name: Docs as tests (${{ matrix.os }}, shard ${{ matrix.shard }}/6)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep npm's cache on D:, before setup-node restores into it. C: is slow
      # at small-file I/O (see the dd-cache action).
      - if: runner.os == 'Windows'
        shell: bash
        run: if [ -d D:/ ]; then echo 'npm_config_cache=D:\npm-cache' >> "$GITHUB_ENV"; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Doc Detective install cache (browsers, drivers, git-bash), shared with
      # test.yml and fixtures.yml. See docs/maintenance/ci-cache-warming.md.
      - if: runner.os == 'Windows'
        uses: ./.github/actions/dd-cache
        with:
          node: '24'

      - run: npm ci
      - run: npm run build
      - name: Link local build
        run: npm link

      - name: Run the docs-as-tests examples
        if: runner.os != 'Windows'
        run: npm run docs:check-docs-as-tests -- --run --shard ${{ matrix.shard }}/6

      # Windows runners can't boot the Android emulator: turn off the lazy SDK
      # install so Android tests skip instead of timing out.
      - name: Run the docs-as-tests examples (Windows)
        if: runner.os == 'Windows'
        env:
          DOC_DETECTIVE_NO_ANDROID_AUTOINSTALL: '1'
        run: npm run docs:check-docs-as-tests -- --run --shard ${{ matrix.shard }}/6 --require-platform windows
