# PR gate: runs the reusable test matrix on pull requests so reviewers see
# matrix failures before merge. All release-side work (publish, smoke-test
# staged build, promote to @latest, Docker build) lives in
# .github/workflows/release.yml, which has a linear needs-chain that only
# advances @latest after the smoke test passes.

name: Test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    # NO `paths:` filter, deliberately. Four of this workflow's checks are
    # REQUIRED by the `main` ruleset, and a path-filtered workflow never reports
    # them at all — so a docs-only PR sat at "blocked" with nothing failing and
    # no way to satisfy the gate. The filter moved into the `changes` job below,
    # which decides whether there is anything to exercise. See ADR 01103.
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Granted so the reusable fixtures workflow's `select` job can read the PR's
  # changed files to narrow its matrix (ADR 01055). A reusable workflow can't
  # hold a permission the caller doesn't grant, so it lives here.
  pull-requests: read

jobs:
  # Does this change set need the matrix at all? Replaces the `paths:` filter
  # this workflow used to carry (ADR 01103). The decision list lives in
  # scripts/select-test-matrix.cjs, which is unit-tested.
  #
  # Fails safe exactly like the fixture selector: no PR context, a `gh api`
  # blip, or an unreadable list all mean RUN the matrix. Under-running is a
  # correctness risk; over-running only costs time.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Decide whether the matrix has anything to exercise
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          # `if files=$(...)` tolerates a non-zero gh api without tripping
          # `set -e`, and `timeout 120` makes a hang fail-safe too.
          if [ -n "$PR" ] && files=$(timeout 120 gh api "repos/${{ github.repository }}/pulls/$PR/files?per_page=100" --paginate --jq '.[].filename'); then
            printf 'changed files:\n%s\n' "$files"
            code=$(printf '%s\n' "$files" | node scripts/select-test-matrix.cjs || echo true)
          fi
          # Only an explicit "false" skips. Anything else (crash, empty,
          # unexpected) coerces to true so the matrix stays on.
          [ "$code" = "false" ] || code=true
          echo "code paths changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Smoke + unit/integration matrix (mocha) and the coverage ratchets. The bulk
  # of the *.spec.json fixtures no longer run here — see the `fixtures` job.
  #
  # Always called, never `if:`-gated: a skipped caller job produces NO nested
  # check runs, which is the failure mode ADR 01103 fixes. `run-matrix` tells the
  # reusable workflow whether to do the work or just report the required
  # contexts.
  test:
    needs: changes
    uses: ./.github/workflows/test.yml
    with:
      run-matrix: ${{ needs.changes.outputs.code == 'true' }}
    secrets:
      # Only forward HERETTO_* on trusted contexts (manual dispatch). PR
      # runs — especially from forks — receive empty strings, so the
      # called workflow never has access to the real values.
      HERETTO_ORG_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.HERETTO_ORG_ID || '' }}
      HERETTO_USERNAME: ${{ github.event_name == 'workflow_dispatch' && secrets.HERETTO_USERNAME || '' }}
      HERETTO_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.HERETTO_TOKEN || '' }}

  # Per-feature Doc Detective fixtures, fanned out one small job per (bundle x
  # OS) so no single job is a 90-minute monolith. Runs the PR's own build. The
  # reusable workflow computes its own matrix (its `select` job), narrowed to
  # the bundles the PR's change set can affect (ADR 01055).
  #
  # Gated, unlike `test`: none of the fixture contexts are required, so skipping
  # the caller is safe here. The guard is load-bearing. fixtures.yml's selector
  # fails safe to the FULL bundle matrix when nothing relevant matched, so
  # without it a docs typo would fan out every bundle, Android and iOS included.
  fixtures:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/fixtures.yml
