# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: nav-wait-load
    steps:
      - goTo:
          url: /wait-delay.html
          origin: http://localhost:8092
          timeout: 30000
          waitUntil:
            networkIdleTime: 500
            domIdleTime: 500
            find:
              selector: "#auto-message"
              elementText: Loaded after 2 seconds
      - find:
          selector: "#auto-message"
          elementText: /^Loaded after \d+ seconds$/
          timeout: 5000
      - click: Trigger delayed action
      - wait: 500
      - find: Action complete!
      - checkLink:
          url: http://localhost:8092/status/200
          statusCodes:
            - 200
            - 204
          headers:
            Accept: application/json
          timeout: 5000
