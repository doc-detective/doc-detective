# The shared core is on by default. Add a voice to BasedOnStyles in your own
# config to pick how the prose should sound.
#
# Std is the standard library the length rules extend; sync pulls it in, and
# it stays present without being enabled.
Packages = https://github.com/vale-cli/Std/releases/latest/download/Std.zip
MinAlertLevel = suggestion

[*.{md,mdx,txt}]
BasedOnStyles = Voices
