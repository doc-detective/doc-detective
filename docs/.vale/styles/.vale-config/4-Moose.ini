# Moose: the house voice for hawkeyexl repos. Direct only; no other voice.
#
# Voices is pinned so every consumer moves together. Bump the tag here, cut a
# new Moose release, and each repo picks it up on its next `vale sync`.
# Voices pulls Std in as its own nested package; sync resolves that chain.
Packages = https://github.com/jdkato/voices/releases/download/v0.1.0/Voices.zip
MinAlertLevel = suggestion

# Same glob label as the Voices package ini, so the two style lists merge
# instead of one replacing the other.
[*.{md,mdx,txt}]
BasedOnStyles = Voices, Direct, Moose
