# Moose: the house voice for hawkeyexl repos. Direct only; no other voice.
#
# The Voices core, the Direct voice, and Vale's Std library are vendored into
# this package (see NOTICE) with a handful of rule fixes, so there is no
# nested package to fetch and nothing to pin. Std is installed but not
# enabled: Direct.Length extends it, and consumers can enable Std rules
# themselves. Refresh from upstream deliberately, re-apply the fixes, and
# cut a new release.
MinAlertLevel = suggestion

[*.{md,mdx,txt}]
BasedOnStyles = Voices, Direct, Moose
