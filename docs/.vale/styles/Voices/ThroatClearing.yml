extends: existence
message: "Throat-clearing: '%s'. Cut it and state the point."
level: error
ignorecase: true
tokens:
  - "here's the thing"
  - "here's what I mean"
  - let me be clear
  - I'll be honest
  - the uncomfortable truth is
  - what most people get wrong
  - "here's what nobody tells you"
  - the part everyone misses
  - this is the part most people skip
