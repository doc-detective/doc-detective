#
# The words with no single right replacement. Each one needs the sentence
# rewritten around it, so this rule reports and stops there; `InflatedWords`
# holds the ones an agent can swap without thinking.
extends: existence
message: "Inflated word: '%s'. Say the plain thing."
level: error
ignorecase: true
tokens:
  - delve
  - foster
  - 'empower(?:s|ed|ing)?'
  - cutting-edge
  - paradigm shift
  - game changer
  - game-changer
  - tapestry
  - realm
  - beacon
  - multifaceted
  - paramount
  - transformative
  - 'embark(?:s|ed|ing)?'
  - 'harness(?:es|ed|ing)?'
  - ever-evolving
