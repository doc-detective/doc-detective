<!DOCTYPE html>
<html lang="en">
<head><title>Find Node.js, then check the API</title></head>
<body>
<h1>Find Node.js, then check the API</h1>
<h2>Find Node.js on Windows</h2>

<ol>
  <li>Find the Node.js executable:
    <pre><code class="language-shell">where node</code></pre></li>
</ol>
<h2>Check the cart</h2>

<ol>
  <li>Send a <code>GET</code> request to <code>http://localhost:8092/api/carts</code>.</li>
</ol>
<h2>Check the products</h2>

<ol>
  <li>Send a <code>GET</code> request to <code>http://localhost:8092/api/products</code>.</li>
</ol>
</body>
</html>
