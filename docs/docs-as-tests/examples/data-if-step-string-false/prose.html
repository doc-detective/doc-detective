<!DOCTYPE html>
<html lang="en">
<head><title>Show help only when Node.js fails</title></head>
<body>
<h1>Show help only when Node.js fails</h1>
<ol>
  <li>Print the Node.js version:
    <pre><code class="language-shell">node --version</code></pre></li>
  <li>If that failed, print the help for <code>node</code>:
    <pre><code class="language-shell">node --help</code></pre></li>
</ol>
</body>
</html>
