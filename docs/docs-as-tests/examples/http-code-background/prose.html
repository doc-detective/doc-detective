<!DOCTYPE html>
<html lang="en">
<head><title>Start a server from code</title></head>
<body>
<h1>Start a server from code</h1>
<p>Start a server on port 8251:</p>
<pre><code class="language-js">require('http').createServer((q, r) =&gt; r.end('ok')).listen(8251);</code></pre>
<p>Stop it when you're done.</p>
</body>
</html>
