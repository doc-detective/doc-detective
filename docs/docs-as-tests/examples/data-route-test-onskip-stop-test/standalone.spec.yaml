# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: data-route-test-onskip-stop-test-windows
    if: $$platform == windows
    onSkip:
      - stop: test
    steps:
      - runShell: where node
  - testId: data-route-test-onskip-stop-test-cart
    steps:
      - httpRequest:
          url: http://localhost:8092/api/carts
          method: get
  - testId: data-route-test-onskip-stop-test-products
    steps:
      - httpRequest:
          url: http://localhost:8092/api/products
          method: get
