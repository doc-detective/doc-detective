# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: sessions-runon-colorscheme
    runOn:
      - platforms:
          - linux
          - mac
          - windows
        browsers:
          name: chrome
          headless: true
          colorScheme: dark
    steps:
      - goTo: http://localhost:8092/multi-tab.html
      - runBrowserScript:
          script: 'return String(matchMedia("(prefers-color-scheme: dark)").matches);'
          output: "true"
