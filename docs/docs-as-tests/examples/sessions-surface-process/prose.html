<!DOCTYPE html>
<html lang="en">
<head><title>Evaluate an expression in the Node.js REPL</title></head>
<body>
<h1>Evaluate an expression in the Node.js REPL</h1>
<ol>
  <li>Start <code>node -i</code> as a process named <code>sessions-prepl</code>, and wait for the <code>&gt;</code> prompt.</li>
  <li>In <code>sessions-prepl</code>, enter <code>40 + 2</code> and press Enter. Wait for the REPL to print <code>42</code>.</li>
  <li>Close <code>sessions-prepl</code>.</li>
</ol>
</body>
</html>
