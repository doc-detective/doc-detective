<!DOCTYPE html>
<html lang="en">
<head><title>Print a greeting</title></head>
<body>
<h1>Print a greeting</h1>
<p>Run this JavaScript with Node.js:</p>
<pre><code class="language-javascript">console.log("Hello from JavaScript");</code></pre>
<p>Run the same greeting in Python:</p>
<pre><code class="language-py">print("Hello from Python")</code></pre>
<p>Or in Bash:</p>
<pre><code class="language-bash">echo "Hello from Bash"</code></pre>
<p>To install the greeter for every project on your machine, run:</p>
<pre><code class="language-bash">npm install --global ./greeter</code></pre>
</body>
</html>
