# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: capture-screenshot-maxvariation-low
    steps:
      - goTo: http://localhost:8092/screenshot-banner.html
      - screenshot:
          path: maxvariation-low.png
          directory: .dd-output
          maxVariation: 0.01
          overwrite: aboveVariation
