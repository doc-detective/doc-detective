<!DOCTYPE html>
<html lang="en">
<head><title>Send a client name in a request body</title></head>
<body>
<h1>Send a client name in a request body</h1>
<ol>
  <li>Load the variables in <code>shop.env</code>.</li>
  <li>Send a <code>POST</code> request to <code>http://localhost:8092/api/orders</code> with the body <code>{"client": "$SHOP_CLIENT"}</code>.</li>
</ol>
</body>
</html>
