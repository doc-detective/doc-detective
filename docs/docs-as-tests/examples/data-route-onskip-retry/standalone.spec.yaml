# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: data-route-onskip-retry
    steps:
      - runShell: node --version
        stepId: version
      - if: $$steps.version.outputs.exitCode != 0
        runShell: node --help
        onSkip:
          - retry:
              limit: 1
      - stepId: npm
        runShell: npm --version
