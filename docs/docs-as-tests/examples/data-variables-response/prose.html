<!DOCTYPE html>
<html lang="en">
<head><title>Create an order and look it up</title></head>
<body>
<h1>Create an order and look it up</h1>
<ol>
  <li>Create an order. Send a <code>POST</code> request to <code>http://localhost:8092/api/orders</code> with this body:
    <pre><code class="language-json">{"id":"ord-1001"}</code></pre></li>
  <li>Look up the order. Send a <code>GET</code> request to <code>http://localhost:8092/api/orders?id=&lt;id&gt;</code>.</li>
</ol>
</body>
</html>
