<!DOCTYPE html>
<html lang="en">
<head><title>Save the Node.js major version</title></head>
<body>
<h1>Save the Node.js major version</h1>
<ol>
  <li>Print the Node.js version:
    <pre><code class="language-shell">node --version</code></pre></li>
  <li>Check that the major version is a number:
    <pre><code class="language-shell">node -e "process.exit(/^[0-9]+$/.test(process.env.NODE_MAJOR) ? 0 : 1)"</code></pre></li>
</ol>
</body>
</html>
