<!DOCTYPE html>
<html lang="en">
<head><title>Print the npm version after a valid Node.js version</title></head>
<body>
<h1>Print the npm version after a valid Node.js version</h1>
<ol>
  <li>Print the Node.js version:
    <pre><code class="language-shell">node --version</code></pre></li>
  <li>If that printed a version, print the npm version:
    <pre><code class="language-shell">npm --version</code></pre></li>
</ol>
</body>
</html>
