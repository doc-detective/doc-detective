# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: http-request-headers-string
    steps:
      - httpRequest:
          url: http://localhost:8093/api/users
          request:
            headers: "X-Test: docs"
          response:
            headers:
              x-echo-test: docs
