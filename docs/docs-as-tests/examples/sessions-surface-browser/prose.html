<!DOCTYPE html>
<html lang="en">
<head><title>Review a page in a second browser session</title></head>
<body>
<h1>Review a page in a second browser session</h1>
<ol>
  <li>Start a headless Firefox session named <code>reviewer</code>.</li>
  <li>In that session, load <a href="http://localhost:8092/multi-tab-child.html?page=review">the review page</a>.</li>
  <li>Check that the page reads "PAGE review".</li>
  <li>Close the <code>reviewer</code> session.</li>
</ol>
</body>
</html>
