# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
runOn:
  - platforms: &a1
      - linux
      - mac
      - windows
    browsers:
      - name: firefox
        headless: true
        window:
          width: 1280
          height: 900
        viewport:
          width: 1200
          height: 800
    browserFallback: off
    retries: 2
  - platforms: *a1
    browsers:
      name: chrome
      headless: true
tests:
  - testId: sessions-state
    steps:
      - goTo: http://localhost:8092/cookies/set/sessions_state/signed-in
      - saveState:
          path: sessions-state.json
          overwrite: true
      - saveState:
          path: sessions-state.json
          directory: tmp
          overwrite: true
      - goTo: http://localhost:8092/cookies/set/sessions_state/signed-out
      - loadState: sessions-state.json
      - goTo: http://localhost:8092/cookies
      - find: sessions_state=signed-in
      - goTo: http://localhost:8092/cookies/set/sessions_state/signed-out
      - loadState:
          path: sessions-state.json
          directory: tmp
      - goTo: http://localhost:8092/cookies
      - find: sessions_state=signed-in
