<!DOCTYPE html>

<head><title>Match the response to a schema</title></head>
<body>
<h1>Match the response to a schema</h1>
<p>Send a <code>POST</code> request to <code>http://localhost:8093/api/invoices</code> with an invoice. In the response, <code>id</code> is a UUID, <code>created</code> is a date-time, <code>code</code> matches <code>^INV-[0-9]+$</code>, and <code>total</code> is a number.</p>
</body>
</html>
