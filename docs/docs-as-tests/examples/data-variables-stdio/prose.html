<!DOCTYPE html>
<html lang="en">
<head><title>Save the Node.js version</title></head>
<body>
<h1>Save the Node.js version</h1>
<ol>
  <li>Print the Node.js version:
    <pre><code class="language-shell">node --version</code></pre></li>
  <li>Check that the saved version starts with <code>v</code>:
    <pre><code class="language-shell">node -e "process.exit(process.env.NODE_VERSION.startsWith('v') ? 0 : 1)"</code></pre></li>
</ol>
</body>
</html>
