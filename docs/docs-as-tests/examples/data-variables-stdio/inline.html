<!DOCTYPE html>

<head><title>Save the Node.js version</title></head>
<body>
<!-- test {"testId":"data-variables-stdio","detectSteps":false} -->
<h1>Save the Node.js version</h1>
<ol>
  <li>Print the Node.js version:
    <pre><code class="language-shell">node --version</code></pre>
    <!-- step {"runShell":"node --version","variables":{"NODE_VERSION":"$$stdio.stdout"}} --></li>
  <li>Check that the saved version starts with <code>v</code>:
    <pre><code class="language-shell">node -e "process.exit(process.env.NODE_VERSION.startsWith('v') ? 0 : 1)"</code></pre>
    <!-- step {"runShell":"node -e \"process.exit(process.env.NODE_VERSION.startsWith('v') ? 0 : 1)\""} --></li>
</ol>
<!-- test end -->
</body>
</html>
