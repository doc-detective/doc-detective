<!DOCTYPE html>
<html lang="en">
<head><title>Send a client name in a header</title></head>
<body>
<h1>Send a client name in a header</h1>
<ol>
  <li>Load the variables in <code>shop.env</code>.</li>
  <li>Send a <code>GET</code> request to <code>http://localhost:8092/api/products</code> with the header <code>X-Test: $SHOP_CLIENT</code>.</li>
</ol>
</body>
</html>
