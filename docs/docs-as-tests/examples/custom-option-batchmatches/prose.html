<!DOCTYPE html>
<html lang="en">
<head><title>Print a greeting with Node.js</title></head>
<body>
<h1>Print a greeting with Node.js</h1>
<p>Define the name to greet:</p>
<pre><code class="language-javascript">const name = "Doc Detective";</code></pre>
<p>Print the greeting:</p>
<pre><code class="language-javascript">console.log(`Hello, ${name}!`);</code></pre>
</body>
</html>
