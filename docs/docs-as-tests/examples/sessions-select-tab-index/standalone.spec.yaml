# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: sessions-select-tab-index
    runOn:
      - browsers:
          name: firefox
          headless: true
        browserFallback: off
    steps:
      - goTo: http://localhost:8092/multi-tab.html
      - goTo:
          url: http://localhost:8092/multi-tab-child.html?page=second
          newTab: second
      - find:
          elementText: PAGE second
          surface:
            browser: firefox
            tab:
              index: -1
