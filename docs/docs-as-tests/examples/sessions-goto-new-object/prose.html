<!DOCTYPE html>
<html lang="en">
<head><title>Open a named window with a named tab</title></head>
<body>
<h1>Open a named window with a named tab</h1>
<ol>
  <li>Start at <a href="http://localhost:8092/multi-tab.html">the multi-tab page</a>.</li>
  <li>Load <a href="http://localhost:8092/multi-tab-child.html?page=report">the report page</a> in a new tab named <code>report</code>.</li>
  <li>Load <a href="http://localhost:8092/multi-tab-child.html?page=settings">the settings page</a> in a new window named <code>settings</code>, with its first tab named <code>general</code>.</li>
  <li>Check that the <code>general</code> tab of the <code>settings</code> window reads "PAGE settings".</li>
</ol>
</body>
</html>
