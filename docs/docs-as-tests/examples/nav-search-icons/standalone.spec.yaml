# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: nav-search-icons
    steps:
      - goTo:
          url: http://localhost:8092/find-image.html
          waitUntil:
            find:
              elementImage:
                base64: 
                threshold: 0.9
      - click:
          elementImage:
            path: search.svg
            color: "#444444"
          elementId: search-icon
      - type:
          - doc detective
          - $ENTER$
      - find:
          selector: "#echo"
          elementText: doc detective
      - type:
          keys: -docs
          selector: "#query"
          inputDelay: 100
      - find:
          selector: "#echo"
          elementText: doc detective-docs
      - find:
          elementImage: save.svg
          click:
            button: right
            duration: 500
      - find:
          selector: "#log"
          elementText: /^click button=2/
