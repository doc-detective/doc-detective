# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: capture-annotationdefaults-style-over-test
    annotationDefaults:
      color: "#0EA5E9"
      strokeWidth: 4
    steps:
      - goTo: http://localhost:8092/enhanced-elements.html
      - screenshot:
          path: defaults-style-over-test.png
          directory: .dd-output
          overwrite: "true"
          annotations:
            - outline: "#username-input"
              style:
                color: "#7C3AED"
