# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: http-local-server
    steps:
      - runCode:
          language: js
          code: |-
            const http = require("http");
            const port = Number(process.argv[2]);
            http.createServer((req, res) => res.end("ok")).listen(port, () => console.log("Listening"));
          args:
            - "8231"
          background:
            name: http-local-api
            waitUntil:
              port: 8231
              stdio: Listening
              httpGet: http://localhost:8231/health
              delayMs: 100
          timeout: 15000
      - httpRequest:
          url: http://localhost:8231/health
          statusCodes: 200
          response:
            body: ok
      - closeSurface: http-local-api
      - runShell:
          command: node -e "require('http').createServer((q, r) => r.end('ok')).listen(8232)"
          background:
            name: http-local-shell
            tty: true
            waitUntil:
              port: 8232
              httpGet: http://localhost:8232/
          timeout: 15000
      - closeSurface: http-local-shell
      - runShell:
          command: "node -e \"console.log('Terminal: ' + process.stdout.columns + 'x' + process.stdout.rows); setInterval(() => {}, 1000);\""
          background:
            name: http-local-tty
            tty:
              cols: 100
              rows: 40
            waitUntil:
              stdio: "Terminal: 100x40"
          timeout: 30000
      - closeSurface: http-local-tty
      - runCode:
          language: js
          code: "console.log('Terminal: ' + process.stdout.columns + 'x' + process.stdout.rows); setInterval(() => {}, 1000);"
          background:
            name: http-local-tty-code
            tty: true
            waitUntil:
              stdio: "Terminal: 120x30"
          timeout: 30000
      - closeSurface: http-local-tty-code
      - runCode:
          language: bash
          code: "node -e \"console.log('Terminal: ' + process.stdout.columns + 'x' + process.stdout.rows); setInterval(() => {}, 1000);\""
          background:
            name: http-local-tty-small
            tty:
              cols: 80
              rows: 24
            waitUntil:
              stdio: "Terminal: 80x24"
          timeout: 30000
      - closeSurface: http-local-tty-small
