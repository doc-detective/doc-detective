<!DOCTYPE html>
<html lang="en">
<head><title>Print the Node.js version twice</title></head>
<body>
<h1>Print the Node.js version twice</h1>
<ol>
  <li>Print the Node.js version:
    <pre><code class="language-shell">node --version</code></pre></li>
  <li>Print the npm version:
    <pre><code class="language-shell">npm --version</code></pre></li>
</ol>
</body>
</html>
