# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: http-code-tty-js
    steps:
      - runCode:
          language: js
          code: "console.log('Terminal: ' + process.stdout.columns + 'x' + process.stdout.rows); setInterval(() => {}, 1000);"
          background:
            name: http-code-tty-js
            tty: true
            waitUntil:
              stdio: "Terminal: 120x30"
          timeout: 30000
      - closeSurface: http-code-tty-js
