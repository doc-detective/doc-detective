<!DOCTYPE html>
<html lang="en">
<head><title>Check the terminal size from code</title></head>
<body>
<h1>Check the terminal size from code</h1>
<p>Print the size of the terminal the code runs in:</p>
<pre><code class="language-js">console.log('Terminal: ' + process.stdout.columns + 'x' + process.stdout.rows); setInterval(() =&gt; {}, 1000);</code></pre>
<p>Stop it when you're done.</p>
</body>
</html>
