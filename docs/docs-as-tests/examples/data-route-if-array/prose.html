<!DOCTYPE html>
<html lang="en">
<head><title>Skip ahead after a valid version</title></head>
<body>
<h1>Skip ahead after a valid version</h1>
<ol>
  <li>Print the Node.js version:
    <pre><code class="language-shell">node --version</code></pre></li>
  <li>Print the npm version:
    <pre><code class="language-shell">npm --version</code></pre></li>
  <li>Find the Node.js executable:
    <pre><code class="language-shell">command -v node</code></pre></li>
</ol>
</body>
</html>
