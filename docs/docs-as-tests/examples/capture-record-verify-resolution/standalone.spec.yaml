# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: capture-record-verify-resolution
    autoRecord: false
    runOn:
      - platforms:
          - windows
          - mac
          - linux
        browsers:
          name: chrome
          headless: true
    steps:
      - goTo: http://localhost:8092/type-echo.html
      - record:
          path: verify-resolution.webm
          directory: .dd-output
          overwrite: "true"
          verify:
            resolution: true
      - click: "Type here:"
      - type: Hello
      - wait: 1000
      - stopRecord: true
