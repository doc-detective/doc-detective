<!DOCTYPE html>
<html lang="en">
<head><title>Run a process in a terminal</title></head>
<body>
<h1>Run a process in a terminal</h1>
<p>Print the terminal size the process sees. It's <code>100x40</code>:</p>
<pre><code class="language-shell">node -e "console.log('Terminal: ' + process.stdout.columns + 'x' + process.stdout.rows); setInterval(() =&gt; {}, 1000);"</code></pre>
<p>Stop it when you're done.</p>
</body>
</html>
