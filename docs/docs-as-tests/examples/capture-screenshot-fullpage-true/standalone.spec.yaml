# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: capture-screenshot-fullpage-true
    steps:
      - goTo:
          url: http://localhost:8092/screenshot-tall.html
          waitUntil:
            networkIdleTime: 0
            domIdleTime: 0
      - screenshot:
          path: fullpage-true.png
          directory: .dd-output
          overwrite: "true"
          fullPage: true
