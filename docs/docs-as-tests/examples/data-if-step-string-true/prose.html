<!DOCTYPE html>
<html lang="en">
<head><title>Print the npm version after Node.js</title></head>
<body>
<h1>Print the npm version after Node.js</h1>
<ol>
  <li>Print the Node.js version:
    <pre><code class="language-shell">node --version</code></pre></li>
  <li>If that worked, print the npm version:
    <pre><code class="language-shell">npm --version</code></pre></li>
</ol>
</body>
</html>
