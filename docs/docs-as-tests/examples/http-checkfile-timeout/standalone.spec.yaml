# yaml-language-server: $schema=https://raw.githubusercontent.com/doc-detective/doc-detective/main/src/common/dist/schemas/spec_v3.schema.json
tests:
  - testId: http-checkfile-timeout
    steps:
      - runShell:
          command: node -e "const fs=require('fs');fs.mkdirSync('output',{recursive:true});setTimeout(()=>fs.writeFileSync('output/late.txt','done'),1000)"
          workingDirectory: .
          background:
            name: late-writer
      - checkFile:
          path: output/late.txt
          timeout: 15000
      - closeSurface: late-writer
