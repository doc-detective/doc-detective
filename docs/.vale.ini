StylesPath = .vale/styles

Vocab = Docs

MinAlertLevel = suggestion

# Moose is the house voice (Voices + Direct + Moose) shared by every hawkeyexl and
# Doc Detective repo: https://github.com/hawkeyexl/moose-vale. The package
# ships its own config, which enables those three styles for every .md, .mdx,
# and .txt file in the repo, so the house voice covers README, ADRs, CLAUDE.md,
# and the docs site alike.
Packages = MDX, Google, alex, Joblint, https://github.com/hawkeyexl/moose-vale/releases/latest/download/Moose.zip

# The published-docs style guide (Google, alex, Joblint, DocDetective) applies
# only to the Fern content pages. Internal working docs (content strategy,
# CLAUDE.md, AGENTS.md, repo skills, src/**) are not end-user pages; they still
# get the house voice from the Moose package config.
#
# Vale applies the LAST matching section's BasedOnStyles and drops the rest, so
# this section must re-list Voices, Direct, and Moose or the Fern pages would
# silently lose the house voice.
[**/fern/pages/**/*.{md,mdx}]
BasedOnStyles = Vale, Google, alex, Joblint, DocDetective, Voices, Direct, Moose

Vale.Terms = NO

# Relax some rules for technical documentation
# Google.Headings is too strict for camelCase API terms like runCode, goTo, etc.
Google.Headings = warning

# Google.Quotes requires American punctuation style which can conflict with
# code examples and technical terms - relax to warning
Google.Quotes = warning

# Vale.Spelling doesn't respect vocabulary in frontmatter/titles
# Relax to warning for technical docs with API terms
Vale.Spelling = warning

# Disable rules that are too strict for technical documentation
# CLI is standard terminology, "Execute" and "fail" are common tech terms,
# and parentheses are often needed for technical explanations
Google.WordList = NO
Google.Parens = NO
Google.Acronyms = NO
alex.ProfanityUnlikely = NO
Joblint.Competitive = NO

# Generated schema reference pages (built by docs/.scripts/buildSchemaReferencesV4.js)
# are machine output: their prose comes verbatim from JSON Schema descriptions and they
# list code identifiers. Don't prose-lint generated files — fixes belong in the schema.
# BasedOnStyles clears the packages; the rules below are cleared because they're enabled
# explicitly in the section above and would otherwise still apply.
#
# Clearing the styles stops the alerts but not the parse: Vale still parses any file a
# section matches, and its .mdx pipeline (mdx2vast) chokes on these tables. CI therefore
# excludes them from the run outright — see the --glob note in .github/workflows/vale.yml.
# Keep this section anyway: it states the intent, and it keeps a direct local
# `vale docs/fern/pages/reference/schemas/...` from emitting ~116 alerts per page.
[**/fern/pages/reference/schemas/*.mdx]
BasedOnStyles =
Vale.Spelling = NO
Google.Headings = NO
Google.Quotes = NO
Google.Passive = NO
Google.Latin = NO

# Changelogs are machine output: semantic-release regenerates CHANGELOG.md from
# Conventional Commit subjects on every release, so any prose fix here is
# overwritten by the next publish and a strict gate would fail on `main`
# immediately afterward. Lint the commit messages instead — commitlint already
# gates those (see .github/workflows/commitlint.yml). The nested `**/changelog/**`
# directories the CI workflow ignores are covered by the same reasoning.
#
# BasedOnStyles clears the packages; the rules below are cleared because they're
# enabled explicitly in the Fern section above and would otherwise still apply.
[**/CHANGELOG.md]
BasedOnStyles =
Vale.Spelling = NO
Google.Headings = NO
Google.Quotes = NO
Google.Passive = NO
Google.Latin = NO

# The generated CLI reference page (built by docs/.scripts/buildCliReference.js)
# is machine output too: its flag/command prose comes verbatim from the yargs
# `.option()` descriptions in src/**. Don't prose-lint it — fixes belong in the
# CLI source, not the generated page.
[**/fern/pages/reference/cli.mdx]
BasedOnStyles =
Vale.Spelling = NO
Google.Headings = NO
Google.Quotes = NO
Google.Passive = NO
Google.Latin = NO
