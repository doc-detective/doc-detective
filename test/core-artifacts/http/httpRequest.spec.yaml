tests:
- steps:
  - loadVariables: ../env
  - httpRequest:
      url: http://localhost:8092/api/users
      method: post
      request:
        body:
          name: $USER
          job: $JOB
      response:
        body:
          name: John Doe
          job: Software Engineer
  - httpRequest:
      url: http://localhost:8092/api/users
      method: post
      request:
        body:
          data:
            - first_name: George
              last_name: Bluth
              id: 1
      response:
        body:
          data:
            - first_name: George
              last_name: Bluth
    variables:
      ID: $$response.body.data[0].id
  - httpRequest:
      url: http://localhost:8092/api/$ID
      method: get
      timeout: 1000
- description: statusCodes accepts a single integer as a one-item list.
  steps:
  - description: A scalar statusCodes accepts the non-default 404.
    httpRequest:
      url: http://localhost:8092/status/404
      statusCodes: 404
  - description: The equivalent one-item array behaves the same.
    httpRequest:
      url: http://localhost:8092/status/404
      statusCodes:
      - 404
