<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual Find Target</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f3f4f6; }
        button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #ffffff;
            font-size: 16px;
        }
        /* Freeze hover/focus styling so captures taken after interaction
           still match templates seeded before it. */
        button:hover, button:focus, button:active { background: #ffffff; outline: none; }
        .glyph { display: inline-block; width: 48px; height: 48px; line-height: 0; }
    </style>
</head>
<body>
    <h1>Visual find target</h1>
    <p>A single distinctive glyph for template-matching fixtures.</p>
    <button id="gear-button" type="button"
        onclick="document.getElementById('click-result').textContent = 'Visual click OK'">
        <span class="glyph" id="glyph" aria-hidden="true"><svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="6" fill="#2563eb"/><circle cx="24" cy="24" r="14" fill="none" stroke="#facc15" stroke-width="4"/><rect x="20" y="8" width="8" height="10" fill="#ef4444"/></svg></span>
        Settings
    </button>
    <p id="click-result"></p>
</body>
</html>
